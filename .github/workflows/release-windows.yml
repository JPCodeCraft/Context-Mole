name: Release Windows

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish win-x64
    runs-on: windows-latest

    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate stable tag
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -cnotmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') {
            throw "Release tags must use the exact vMAJOR.MINOR.PATCH format."
          }
          "VERSION=$($env:GITHUB_REF_NAME.Substring(1))" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up the pinned .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            packages.lock.json
            src/**/packages.lock.json
            tests/**/packages.lock.json
            tools/packages.lock.json

      - name: Verify SDK and branding source
        shell: pwsh
        run: |
          $expectedSdk = (Get-Content global.json | ConvertFrom-Json).sdk.version
          $actualSdk = dotnet --version
          if ($actualSdk -cne $expectedSdk) { throw "Expected .NET SDK $expectedSdk but found $actualSdk." }
          ./tools/ValidateWindowsBranding.ps1

      - name: Restore locked dependencies
        run: dotnet restore MCPIndexSearch.slnx --locked-mode

      - name: Build the complete solution
        run: dotnet build MCPIndexSearch.slnx -c Release --no-restore -p:ContinuousIntegrationBuild=true -p:Version=${{ env.VERSION }} -p:SourceRevisionId=${{ github.sha }}

      - name: Run automated tests
        run: dotnet test --solution MCPIndexSearch.slnx -c Release --no-restore --no-build

      - name: Publish the Windows application and MCP sidecar
        shell: pwsh
        run: |
          dotnet publish src/App.UI/MCPIndexSearch.App.UI.csproj `
            -c Release `
            -f net10.0 `
            -r win-x64 `
            --self-contained true `
            --no-restore `
            -o artifacts/publish/win-x64 `
            -p:Version=$env:VERSION `
            -p:SourceRevisionId=$env:GITHUB_SHA `
            -p:ContinuousIntegrationBuild=true `
            -p:PublishSingleFile=false `
            -p:PublishTrimmed=false `
            -p:PublishReadyToRun=false `
            -p:PublishAot=false

      - name: Validate published payload
        shell: pwsh
        run: |
          $main = "artifacts/publish/win-x64/MCPIndexSearch.App.UI.exe"
          $sidecar = "artifacts/publish/win-x64/mcp-server/MCPIndexSearch.Mcp.exe"
          $icon = "src/App.UI/Assets/mcp-index-search.ico"
          foreach ($required in @($main, $sidecar, $icon)) {
            if (-not (Test-Path -LiteralPath $required -PathType Leaf)) { throw "Missing required publish file: $required" }
          }
          if ((Get-Item $main).VersionInfo.ProductVersion -notlike "$env:VERSION*") { throw "The application version does not match the tag." }
          if ((Get-Item $sidecar).VersionInfo.ProductVersion -notlike "$env:VERSION*") { throw "The MCP sidecar version does not match the tag." }
          ./tools/ValidateWindowsBranding.ps1 -PublishedExecutable $main

      - name: Generate GitHub release notes
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $notes = gh api --method POST "repos/$env:GITHUB_REPOSITORY/releases/generate-notes" `
            -f tag_name="$env:GITHUB_REF_NAME" `
            -f target_commitish="$env:GITHUB_SHA" `
            --jq .body
          if ($LASTEXITCODE -ne 0) { throw "GitHub could not generate release notes." }
          $notes | Out-File -FilePath artifacts/release-notes.md -Encoding utf8

      - name: Download the previous win-x64 feed
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/velopack | Out-Null
          $previousTag = gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=1" --jq '.[0].tag_name'
          if ($LASTEXITCODE -eq 0 -and -not [string]::IsNullOrWhiteSpace($previousTag)) {
            dnx vpk download github `
              --repoUrl "https://github.com/$env:GITHUB_REPOSITORY" `
              --channel win-x64 `
              --outputDir artifacts/velopack `
              --token "$env:GITHUB_TOKEN" `
              --version 1.2.0 `
              --yes
          } else {
            Write-Host "No previous public release exists; a full package will be created."
          }

      - name: Create the per-user Windows installer
        shell: pwsh
        run: |
          dnx vpk pack `
            --packId JPCodeCraft.MCPIndexSearch `
            --packVersion "$env:VERSION" `
            --packDir artifacts/publish/win-x64 `
            --mainExe MCPIndexSearch.App.UI.exe `
            --packTitle MCPIndexSearch `
            --packAuthors JPCodeCraft `
            --runtime win-x64 `
            --channel win-x64 `
            --outputDir artifacts/velopack `
            --icon src/App.UI/Assets/mcp-index-search.ico `
            --releaseNotes artifacts/release-notes.md `
            --noPortable `
            --version 1.2.0 `
            --yes

      - name: Validate the Velopack output
        shell: pwsh
        run: |
          $setup = Get-ChildItem artifacts/velopack -File -Filter '*Setup*.exe' | Sort-Object LastWriteTimeUtc -Descending | Select-Object -First 1
          $fullPackage = Get-ChildItem artifacts/velopack -File -Filter '*-full.nupkg' | Sort-Object LastWriteTimeUtc -Descending | Select-Object -First 1
          $feed = "artifacts/velopack/releases.win-x64.json"
          if ($null -eq $setup) { throw "Velopack did not produce Setup.exe." }
          if ($null -eq $fullPackage) { throw "Velopack did not produce a full package." }
          if (-not (Test-Path -LiteralPath $feed -PathType Leaf)) { throw "Velopack did not produce releases.win-x64.json." }
          $expanded = Join-Path $env:RUNNER_TEMP "mcpindexsearch-package"
          Expand-Archive -LiteralPath $fullPackage.FullName -DestinationPath $expanded -Force
          if ($null -eq (Get-ChildItem $expanded -Recurse -File -Filter MCPIndexSearch.Mcp.exe | Select-Object -First 1)) {
            throw "The full package does not contain the MCP sidecar."
          }
          ./tools/ValidateWindowsBranding.ps1 -SetupExecutable $setup.FullName

      - name: Publish GitHub Release and update feed
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          dnx vpk upload github `
            --repoUrl "https://github.com/$env:GITHUB_REPOSITORY" `
            --outputDir artifacts/velopack `
            --channel win-x64 `
            --token "$env:GITHUB_TOKEN" `
            --publish `
            --merge `
            --tag "$env:GITHUB_REF_NAME" `
            --targetCommitish "$env:GITHUB_SHA" `
            --releaseName "MCPIndexSearch $env:GITHUB_REF_NAME" `
            --version 1.2.0 `
            --yes
          gh release edit "$env:GITHUB_REF_NAME" --notes-file artifacts/release-notes.md --repo "$env:GITHUB_REPOSITORY"
